<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>签名生成器 · SIGNATURE STUDIO</title>
    <meta name="description" content="输入名字，按真实运笔顺序写出，并导出 MP4。" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='3' fill='%230C0F16'/><path d='M6 22c4-10 7 4 10-6 2-6 4 5 6 2' stroke='%23FF9BC6' stroke-width='2.2' fill='none'/></svg>"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span class="name">SIGNATURE STUDIO</span>
          <span class="ver mono">v0.1</span>
        </div>
        <div class="top-actions">
          <span class="cap mono" id="capability">检查编码器…</span>
          <button type="button" class="btn ghost" id="share">复制分享链接</button>
          <button type="button" class="btn primary" id="export">导出 MP4</button>
        </div>
      </header>

      <main class="layout">
        <section class="stage-wrap" aria-label="预览">
          <div class="stage" id="stage-box">
            <canvas id="stage"></canvas>
          </div>
          <div class="stage-bar">
            <button type="button" class="btn play" id="play">重播</button>
            <div class="specs mono" id="specs">1920×1080 · 30fps · 5.0s · 150 帧</div>
          </div>
        </section>

        <aside class="panel" aria-label="参数面板">
          <div class="panel-scroll">
            <fieldset class="group">
              <legend class="mono">01 / 名字</legend>
              <label class="field">
                <span>名字 A</span>
                <input id="nameA" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
              </label>
              <label class="field">
                <span>名字 B <i>可空</i></span>
                <input id="nameB" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
              </label>
              <p class="note hint" id="nameHint">
                中文姓名可直接输入（内置 GB2312 全部 6763 个汉字，按真实笔顺书写），也可中英混排。
              </p>
              <p class="note" id="missingNote" hidden></p>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">02 / 颜色</legend>
              <div class="pair">
                <label class="field color">
                  <span>颜色 A</span>
                  <input id="colorA" type="color" />
                  <b class="mono" id="colorAHex">#FFFFFF</b>
                </label>
                <label class="field color">
                  <span>颜色 B</span>
                  <input id="colorB" type="color" />
                  <b class="mono" id="colorBHex">#FFC0CC</b>
                </label>
              </div>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">03 / 字号</legend>
              <label class="field slider">
                <span>字号倍率 A</span>
                <input id="scaleA" type="range" min="0.8" max="2.2" step="0.05" />
                <b class="mono" id="scaleAVal">1.50×</b>
              </label>
              <label class="field slider">
                <span>字号倍率 B</span>
                <input id="scaleB" type="range" min="0.8" max="2.2" step="0.05" />
                <b class="mono" id="scaleBVal">1.60×</b>
              </label>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">04 / 收尾</legend>
              <label class="field">
                <span>装饰</span>
                <select id="deco">
                  <option value="sun">太阳</option>
                  <option value="moon">月亮</option>
                  <option value="star">星星</option>
                  <option value="sparkle">闪光</option>
                  <option value="heart">爱心</option>
                  <option value="cat">猫耳</option>
                  <option value="dog">小狗</option>
                  <option value="cloud">云朵</option>
                  <option value="bolt">闪电</option>
                  <option value="flame">火焰</option>
                  <option value="crown">皇冠</option>
                  <option value="note">音符</option>
                  <option value="leaf">叶子</option>
                  <option value="planet">星球</option>
                  <option value="none">无</option>
                </select>
              </label>
              <label class="field">
                <span>装饰动作</span>
                <select id="decoMotion">
                  <option value="pop">收尾弹出</option>
                  <option value="follow">跟随笔尖</option>
                  <option value="drift">悬浮漂移</option>
                  <option value="orbit">绕字旋转</option>
                  <option value="drop">落下弹跳</option>
                  <option value="spin">自旋入场</option>
                  <option value="swing">钟摆摇晃</option>
                  <option value="breathe">呼吸缩放</option>
                </select>
              </label>
              <p class="note hint" id="motionHint"></p>
              <label class="field slider">
                <span>装饰倍率</span>
                <input id="decoScale" type="range" min="0.4" max="1.2" step="0.05" />
                <b class="mono" id="decoScaleVal">0.70×</b>
              </label>
              <label class="field slider">
                <span>时长</span>
                <input id="duration" type="range" min="3" max="10" step="0.5" />
                <b class="mono" id="durationVal">5.0s</b>
              </label>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">05 / 字形与效果</legend>
              <label class="field">
                <span>中文字体</span>
                <select id="cjkFont">
                  <option value="kai">楷书 · 内置笔画</option>
                  <option value="brush">毛笔楷书 · 马善政</option>
                  <option value="cursive">行书 · 志莽</option>
                </select>
              </label>
              <label class="field">
                <span>笔迹风格</span>
                <select id="style">
                  <option value="ink">细笔 · 清瘦</option>
                  <option value="brush">毛笔 · 出锋</option>
                  <option value="signature">连笔签名 · 右倾</option>
                  <option value="round">圆润 · 粗笔</option>
                </select>
              </label>
              <div class="field">
                <span>动态效果 <i>可多选</i></span>
                <div class="checks" id="effects">
                  <label class="check"><input type="checkbox" value="trail" /><span>笔尖拖尾</span></label>
                  <label class="check"><input type="checkbox" value="splash" /><span>墨点飞溅</span></label>
                  <label class="check"><input type="checkbox" value="pulse" /><span>呼吸辉光</span></label>
                  <label class="check"><input type="checkbox" value="ripple" /><span>写完涟漪</span></label>
                  <label class="check"><input type="checkbox" value="seal" /><span>落款印章</span></label>
                </div>
              </div>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">06 / 输出</legend>
              <div class="field">
                <span>画幅</span>
                <div class="seg" id="ratio">
                  <button type="button" data-value="16:9" aria-pressed="true">16:9</button>
                  <button type="button" data-value="9:16" aria-pressed="false">9:16</button>
                  <button type="button" data-value="1:1" aria-pressed="false">1:1</button>
                </div>
              </div>
              <div class="field">
                <span>清晰度</span>
                <div class="seg" id="res">
                  <button type="button" data-value="1080" aria-pressed="true">1080</button>
                  <button type="button" data-value="720" aria-pressed="false">720</button>
                </div>
              </div>
              <button type="button" class="btn wide ghost" id="exportWebm">导出 WebM（草稿）</button>
              <p class="note">
                正式导出走 WebCodecs 离线帧循环，帧数严格等于 时长×30。Safari 或旧内核会自动降级为 WebM 草稿格式。
              </p>
            </fieldset>
          </div>
        </aside>
      </main>

      <div class="exporting" id="exporting" hidden>
        <div class="exporting-inner">
          <div class="mono label" id="exportLabel">正在编码 0 / 150 帧</div>
          <div class="bar"><span id="exportBar"></span></div>
          <div class="row">
            <span class="mono note" id="exportNote">离线帧循环 · 不读真实时钟</span>
            <button type="button" class="btn ghost small" id="cancelExport">取消</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
