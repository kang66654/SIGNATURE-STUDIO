-moz-range-track{height:3px;background:var(--line-2);border-radius:2px}.field.slider input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.color{grid-template-columns:1fr auto;align-items:center}.field.color>span{grid-column:1 / -1}.field.color input[type=color]{width:100%;height:44px;padding:0;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;cursor:pointer}.field.color input[type=color]::-webkit-color-swatch-wrapper{padding:3px}.field.color input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}.field.color b{grid-column:1 / -1;font-size:10.5px;color:var(--muted);font-weight:500}.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:#fff}.seg button{min-height:44px;border:0;border-right:1px solid var(--line);background:transparent;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-2);cursor:pointer}.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}.seg button:hover:not([aria-pressed=true]){background:var(--paper-2)}.note{margin:0;font-size:11.5px;line-height:1.7;color:var(--muted)}.note.warn{color:#a33}.exporting{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#05070cb8;backdrop-filter:blur(3px)}.exporting-inner{width:min(440px,calc(100vw - 40px));background:#fff;padding:22px;border-radius:4px;box-shadow:0 30px 80px -30px #0009}.exporting-inner .label{font-size:12px;letter-spacing:.05em;margin-bottom:12px}.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--blue);transition:width .12s linear}.exporting-inner .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.toast{position:fixed;left:50%;bottom:24px;transform:tran   <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span class="name">SIGNATURE STUDIO</span>
          <span class="ver mono">v0.1</span>
        </div>
        <div class="top-actions">
          <span class="cap mono" id="capability">检查编码器…</span>
          <button type="button" class="btn ghost" id="share">复制分享链接</button>
          <button type="button" class="btn primary" id="export">导出 MP4</button>
        </div>
      </header>

      <main class="layout">
        <section class="stage-wrap" aria-label="预览">
          <div class="stage" id="stage-box">
            <canvas id="stage"></canvas>
          </div>
          <div class="stage-bar">
            <button type="button" class="btn play" id="play">重播</button>
            <div class="specs mono" id="specs">1920×1080 · 30fps · 5.0s · 150 帧</div>
          </div>
        </section>

        <aside class="panel" aria-label="参数面板">
          <div class="panel-scroll">
            <fieldset class="group">
              <legend class="mono">01 / 名字</legend>
              <label class="field">
                <span>名字 A</span>
                <input id="nameA" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
              </label>
              <label class="field">
                <span>名字 B <i>可空</i></span>
                <input id="nameB" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
              </label>
              <p class="note" id="missingNote" hidden></p>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">02 / 颜色</legend>
              <div class="pair">
                <label class="field color">
                  <span>颜色 A</span>
                  <input id="colorA" type="color" />
                  <b class="mono" id="colorAHex">#FFFFFF</b>
                </label>
                <label class="field color">
                  <span>颜色 B</span>
                  <input id="colorB" type="color" />
                  <b class="mono" id="colorBHex">#FFC0CC</b>
                </label>
              </div>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">03 / 字号</legend>
              <label class="field slider">
                <span>字号倍率 A</span>
                <input id="scaleA" type="range" min="0.8" max="2.2" step="0.05" />
                <b class="mono" id="scaleAVal">1.50×</b>
              </label>
              <label class="field slider">
                <span>字号倍率 B</span>
                <input id="scaleB" type="range" min="0.8" max="2.2" step="0.05" />
                <b class="mono" id="scaleBVal">1.60×</b>
              </label>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">04 / 收尾</legend>
              <label class="field">
                <span>装饰</span>
                <select id="deco">
                  <option value="sun">太阳</option>
                  <option value="cat">猫耳</option>
                  <option value="dog">小狗</option>
                  <option value="cloud">云朵</option>
                  <option value="star">星星</option>
                  <option value="heart">爱心</option>
                  <option value="none">无</option>
                </select>
              </label>
              <label class="field slider">
                <span>装饰倍率</span>
                <input id="decoScale" type="range" min="0.4" max="1.2" step="0.05" />
                <b class="mono" id="decoScaleVal">0.70×</b>
              </label>
              <label class="field slider">
                <span>时长</span>
                <input id="duration" type="range" min="3" max="10" step="0.5" />
                <b class="mono" id="durationVal">5.0s</b>
              </label>
            </fieldset>

            <fieldset class="group">
              <legend class="mono">05 / 输出</legend>
              <div class="field">
                <span>画幅</span>
                <div class="seg" id="ratio">
                  <button type="button" data-value="16:9" aria-pressed="true">16:9</button>
                  <button type="button" data-value="9:16" aria-pressed="false">9:16</button>
                  <button type="button" data-value="1:1" aria-pressed="false">1:1</button>
                </div>
              </div>
              <div class="field">
                <span>清晰度</span>
                <div class="seg" id="res">
                  <button type="button" data-value="1080" aria-pressed="true">1080</button>
                  <button type="button" data-value="720" aria-pressed="false">720</button>
                </div>
              </div>
              <button type="button" class="btn wide ghost" id="exportWebm">导出 WebM（草稿）</button>
              <p class="note">
                正式导出走 WebCodecs 离线帧循环，帧数严格等于 时长×30。Safari 或旧内核会自动降级为 WebM 草稿格式。
              </p>
            </fieldset>
          </div>
        </aside>
      </main>

      <div class="exporting" id="exporting" hidden>
        <div class="exporting-inner">
          <div class="mono label" id="exportLabel">正在编码 0 / 150 帧</div>
